
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Proyectos • Apoyo en Guatemala</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{ --line: rgba(255,255,255,.08); --muted:#bfe9ff; --blue:#3b82f6; --cyan:#06b6d4; }
    body{ margin:0; font-family:'Poppins',system-ui; color:#e6eef6;
          background: radial-gradient(900px 600px at 20% 10%, rgba(56,189,248,.10), transparent 60%),
                      radial-gradient(800px 500px at 80% 70%, rgba(45,212,191,.08), transparent 60%),
                      linear-gradient(180deg,#05060a,#07101a); }
    header{ padding:16px 24px; display:flex; justify-content:space-between; align-items:center;
            border-bottom:1px solid var(--line); backdrop-filter: blur(6px); }
    header a{ color:#8ddcff; text-decoration:none; }
    .container{ max-width:1100px; margin:20px auto; padding:0 18px; }
    .toolbar{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
    .search{ flex:1; }
    .search input{ width:100%; padding:10px 12px; border-radius:10px;
                   background: rgba(255,255,255,.05); border:1px solid var(--line); color:#e6eef6; outline:none; }
    table{ width:100%; border-collapse: collapse; }
    thead th{ text-align:left; font-weight:600; padding:10px; border-bottom:1px solid var(--line); color:#8ddcff; }
    tbody td{ padding:10px; border-bottom:1px solid var(--line); vertical-align:middle; }
    .thumb{ width:72px; height:48px; border-radius:8px; object-fit:cover; background: rgba(56,189,248,.07); border:1px dashed rgba(56,189,248,.25); display:block; }
    .thumb.noimg{ display:flex; align-items:center; justify-content:center; color:rgba(200,240,255,.8); font-size:12px; }
    .progress{ width:100%; height:8px; background: rgba(255,255,255,.08); border-radius:8px; overflow:hidden; }
    .progress > div{ height:100%; background: linear-gradient(90deg, var(--cyan), var(--blue)); }
    .meta{ color:var(--muted); font-size:12px; margin-top:4px; }
    .btn{ padding:8px 12px; border-radius:8px; background: linear-gradient(90deg, var(--cyan), var(--blue)); color:#031018; border:none; font-weight:600; cursor:pointer; box-shadow: 0 0 8px rgba(56,189,248,.35); }
  </style>
</head>
<body data-page="list">
<header>
  <a href="index.html">← Volver al inicio</a>
  <div>Todos los proyectos</div>
  <div></div>
</header>
<div class="container">
  <div class="toolbar">
    <div class="search"><input id="list-search" placeholder="Buscar por nombre o descripción..."></div>
  </div>
  <table>
    <thead>
      <tr>
        <th>Proyecto</th>
        <th style="width:25%">Progreso</th>
        <th style="width:18%">Meta / Recaudado</th>
        <th style="width:120px">Acciones</th>
      </tr>
    </thead>
    <tbody id="list-body"></tbody>
  </table>
</div>

<div id="modal-root" class="modal-root"></div>
<script src="./js/main.js"></script>
<script>
  // Hook list rendering after main.js init
  window.addEventListener('DOMContentLoaded', () => {
    const body = document.body;
    if(!body || body.dataset.page !== 'list') return;
    const tbody = document.getElementById('list-body');
    const search = document.getElementById('list-search');

    function renderList(filter=''){
      const ps = (window.__AP && window.__AP.projects) ? window.__AP.projects.slice() : [];
      const filtered = ps.filter(p => {
        if(!filter) return true;
        const q = filter.toLowerCase();
        return (p.titulo && p.titulo.toLowerCase().includes(q)) || (p.descripcion && p.descripcion.toLowerCase().includes(q));
      });
      tbody.innerHTML = filtered.map(p => {
        const goal = Number(p.montoSolicitado||p.goal||0)||0;
        const raised = Number(p.collected||0)||0;
        const pct = goal>0 ? Math.min(Math.round((raised/goal)*100),100) : 0;
        const hasImg = p.img && String(p.img).trim()!=='';
        const thumb = hasImg ? `<img class="thumb" src="${p.img}" alt="${p.titulo}">`
                             : `<div class="thumb noimg">Sin<br>imagen</div>`;
        return `
          <tr>
            <td>
              <div style="display:flex; gap:10px; align-items:center;">
                ${thumb}
                <div>
                  <div style="font-weight:600">${p.titulo||'Proyecto'}</div>
                  <div style="font-size:12px; color:#bfe9ff">${p.descripcion||''}</div>
                </div>
              </div>
            </td>
            <td>
              <div class="progress"><div style="width:${pct}%"></div></div>
              <div class="meta">${pct}%</div>
            </td>
            <td>
              <div class="meta">$${raised} recaudado</div>
              <div class="meta">de $${goal}</div>
            </td>
            <td><button class="btn" data-donar="${p.id}">Donar</button></td>
          </tr>
        `;
      }).join('');
      // bind donate
      tbody.querySelectorAll('button[data-donar]').forEach(btn => {
        const id = Number(btn.getAttribute('data-donar'));
        const proj = (window.__AP && window.__AP.projects) ? window.__AP.projects.find(x=>x.id===id) : null;
        if(proj) btn.onclick = ()=> window.__AP && window.openDonateModal ? window.openDonateModal(proj) : alert('No disponible');
      });
    }

    renderList();
    search.addEventListener('input', e => renderList(e.target.value));
  });
</script>
</body>
</html>
