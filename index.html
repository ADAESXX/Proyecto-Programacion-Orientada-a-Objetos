<style>
:root{
  --bg1:#06111f;
  --bg2:#071b2a;
  --card:#0e1b2a;
  --muted:#9db0c2;
  --accent:#2dd4bf; /* green-cyan */
  --accent2:#38bdf8; /* electric blue */
  --glow: 0 0 18px rgba(56,189,248,.25), 0 0 40px rgba(45,212,191,.18);
}
/* Canvas background */
#bg-grid{
  position: fixed;
  inset: 0;
  width: 100vw; height: 100vh;
  z-index: 0;
  pointer-events: none;
}

/* Layer content above */
header, main, footer, .modal, .modal-root { position: relative; z-index: 1; }

/* Body gradient */
body{
  background: radial-gradient(1200px 800px at 20% 10%, rgba(56,189,248,0.10), transparent 60%),
              radial-gradient(1000px 700px at 80% 70%, rgba(45,212,191,0.08), transparent 60%),
              linear-gradient(180deg, var(--bg1), var(--bg2));
}

/* Buttons */
.btn, .submit-btn{
  background: linear-gradient(90deg, var(--accent2), var(--accent));
  color:#031018; border:none;
  box-shadow: var(--glow);
  transition: transform .12s ease, box-shadow .2s ease, filter .2s ease;
}
.btn:hover, .submit-btn:hover{ transform: translateY(-1px); filter: brightness(1.08); }
.btn-ghost{
  background: rgba(255,255,255,0.03) !important;
  border:1px solid rgba(255,255,255,0.08) !important;
  color: var(--muted) !important;
}
/* Cards */
.card{
  background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  border:1px solid rgba(56,189,248,0.15);
  box-shadow: 0 10px 30px rgba(0,0,0,.35), 0 0 22px rgba(56,189,248,.06);
}
.card h3{ color:#8ddcff; text-shadow: 0 0 6px rgba(56,189,248,.25); }
.card img{ border-bottom:1px solid rgba(56,189,248,.15); }

/* Header */
header{
  background: rgba(8,17,28,.65);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid rgba(56,189,248,0.12);
}
header h1{ color:#8ddcff; letter-spacing:.3px; }
header p{ color: var(--muted); }

/* Modals */
.modal-root{ background: linear-gradient(rgba(4,10,18,.6), rgba(4,10,18,.6)); }
.modal{
  background: linear-gradient(180deg, rgba(14,27,42,.95), rgba(10,20,33,.95));
  border:1px solid rgba(56,189,248,0.15);
  box-shadow: var(--glow);
}
.close-x{ background:#ef4444; }

/* Inputs in modal (keep v4.1 style but harmonize) */
.modal input, .modal select, .modal textarea{
  width:100%;
  padding:10px;
  background: rgba(255,255,255,.05);
  border:1px solid rgba(56,189,248,.18);
  border-radius:10px;
  color:#e6f2ff;
  font-family:'Poppins', sans-serif;
  outline:none;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
}
.modal input::placeholder, .modal textarea::placeholder{ color: rgba(173, 205, 233, .6); }
</style>

<script>
(function(){
  const c = document.getElementById('bg-grid');
  if(!c) return;
  const ctx = c.getContext('2d');
  function resize(){
    c.width = window.innerWidth;
    c.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();
  let t = 0;
  function draw(){
    const w = c.width, h = c.height;
    ctx.clearRect(0,0,w,h);
    const spacing = 40;
    ctx.lineWidth = 1;
    // Glow lines
    for(let y=0; y<h; y+=spacing){
      ctx.strokeStyle = 'rgba(56,189,248,0.08)';
      ctx.beginPath();
      ctx.moveTo(0, (y + (Math.sin((t+y)*0.002)*6)));
      ctx.lineTo(w, (y + (Math.sin((t+y)*0.002)*6)));
      ctx.stroke();
    }
    for(let x=0; x<w; x+=spacing){
      ctx.strokeStyle = 'rgba(45,212,191,0.08)';
      ctx.beginPath();
      ctx.moveTo((x + (Math.cos((t+x)*0.002)*6)), 0);
      ctx.lineTo((x + (Math.cos((t+x)*0.002)*6)), h);
      ctx.stroke();
    }
    // Nodes
    for(let y=0; y<h; y+=spacing){
      for(let x=0; x<w; x+=spacing){
        const px = x + Math.cos((t+x)*0.002)*3;
        const py = y + Math.sin((t+y)*0.002)*3;
        const g = ctx.createRadialGradient(px,py,0,px,py,3);
        g.addColorStop(0,'rgba(56,189,248,0.35)');
        g.addColorStop(1,'rgba(56,189,248,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(px,py,3,0,Math.PI*2);
        ctx.fill();
      }
    }
    t += 16;
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

<script>
window.openModal = function(html){
  const root = document.getElementById('modal-root');
  root.classList.add('show');
  root.innerHTML = `<div class="modal"><button class="close-x" onclick="__closeModal()">×</button>${html}</div>`;
  return { root, panel: root.firstElementChild };
}
window.__closeModal = function(){
  const root = document.getElementById('modal-root');
  root.classList.remove('show');
  root.innerHTML = '';
}
</script>

<script>
window.openNotifModal = function(){
  let session = null;
  try { session = JSON.parse(localStorage.getItem('ks_session')||'null'); } catch(e){ session = null; }

  if(!session){
    const html = `<h3>Notificaciones</h3>
      <div style="opacity:.85">Inicia sesión para ver tus notificaciones.</div>
      <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-primary" onclick="__closeModal()">Cerrar</button>
      </div>`;
    openModal(html);
    return;
  }

  let items = [];
  try{ if(typeof Notificaciones==='function'){ items = new Notificaciones().list(session.id); } }catch(e){ items = []; }

  const listHtml = items.length ? items.map(it => `
    <div style="padding:8px; border-bottom:1px solid rgba(255,255,255,.08)">
      <div style="font-weight:700">${it.projectTitle||'Proyecto'} • 
        <span style="opacity:.8">${it.type||'actividad'}</span>
      </div>
      ${it.type==='donacion' ? `<div class="small" style="opacity:.9">Monto: Q${(it.amount||0)} • Tipo: ${it.donationType||'-'}</div>` : ''}
      ${it.message ? `<div class="small" style="opacity:.85">Mensaje: ${it.message}</div>` : ''}
      ${it.commentText ? `<div class="small" style="opacity:.85">Comentario: ${it.commentText}</div>` : ''}
      ${it.helpText ? `<div class="small" style="opacity:.85">Ayuda ofrecida: ${it.helpText}</div>` : ''}
      <div class="small" style="opacity:.7">de ${it.fromUserName||'Usuario'} • ${new Date(it.createdAt||Date.now()).toLocaleString()}</div>
    </div>`).join('') : '<div style="opacity:.8">No tienes notificaciones.</div>';

  const htmlModal = `<h3>Notificaciones</h3>
    <div style="max-height:300px; overflow:auto; border:1px solid rgba(255,255,255,.08); border-radius:10px; margin-top:8px">${listHtml}</div>
    <div style="margin-top:12px; display:flex; gap:8px; justify-content:flex-end">
      <button class="btn btn-ghost" id="notif-demo">Crear notificación de prueba</button>
      <button class="btn btn-ghost" id="notif-mark">Marcar como leídas</button>
      <button class="btn btn-primary" onclick="__closeModal()">Cerrar</button>
    </div>`;

  const m = openModal(htmlModal);
  const mark = m.panel.querySelector('#notif-mark');
  if(mark){
    mark.onclick = () => { try{ new Notificaciones().markAllRead(session.id); }catch(e){} __closeModal(); };
  }
  const demo = m.panel.querySelector('#notif-demo');
  if(demo){
    demo.onclick = () => {
      try{
        const n = new Notificaciones();
        n.add(session.id, { type:'prueba', projectId: 0, projectTitle:'Demo de notificación', fromUserId: session.id, fromUserName: session.nombre });
        __closeModal(); setTimeout(()=>openNotifModal(), 10); // refrescar sin alerts
      }catch(e){ /* silencioso */ }
    };
  }
}
</script>

<script>
window.openMessagesModal = function(){
  let session = null;
  try { session = JSON.parse(localStorage.getItem('ks_session')||'null'); } catch(e){ session = null; }
  if(!session){
    const html = `<h3>Mensajes</h3>
      <div style="opacity:.85">Inicia sesión para usar mensajes.</div>
      <div style="margin-top:12px;display:flex;justify-content:flex-end;gap:8px">
        <button class="btn btn-primary" onclick="__closeModal()">Cerrar</button>
      </div>`;
    openModal(html); return;
  }
  const users = JSON.parse(localStorage.getItem('ks_users')||'[]');
  const me = users.find(u=>String(u.id)===String(session.id)) || session;
  const others = users.filter(u=>String(u.id)!==String(session.id));

  const svc = new Mensajes();
  let inbox = svc.listInbox(session.id);
  let sent  = svc.listSent(session.id);

  function row(m){
    return `<div style="padding:8px;border-bottom:1px solid rgba(255,255,255,.08)">
      <div style="font-weight:600">${m.fromName} → ${m.toName}</div>
      <div class="small" style="opacity:.85">${(m.text||'').replace(/</g,'&lt;')}</div>
      <div class="small" style="opacity:.7">${new Date(m.createdAt).toLocaleString()}</div>
    </div>`;
  }

  function renderPanel(kind){
    if(kind==='inbox'){
      inbox = svc.listInbox(session.id);
      return inbox.length? inbox.map(row).join('') : '<div style="opacity:.8">No tienes mensajes.</div>';
    } else if(kind==='sent'){
      sent = svc.listSent(session.id);
      return sent.length? sent.map(row).join('') : '<div style="opacity:.8">No has enviado mensajes.</div>';
    }
    return '';
  }

  const options = others.map(u=>`<option value="${u.id}">${u.nombre} (${u.tipoUsuario||u.rol||''})</option>`).join('');
  const html = `<h3>Mensajes</h3>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">
      <button class="btn btn-ghost" id="tab-inbox">Bandeja</button>
      <button class="btn btn-ghost" id="tab-sent">Enviados</button>
      <button class="btn btn-ghost" id="tab-compose">Redactar</button>
    </div>
    <div id="msg-panel" style="margin-top:10px;border:1px solid rgba(255,255,255,.08);border-radius:10px;max-height:320px;overflow:auto;padding:8px">
      ${renderPanel('inbox')}
    </div>
    <div id="compose" style="display:none;margin-top:10px;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:12px">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <label>Para:</label>
        <select id="msg-to" class="btn btn-ghost" style="min-width:220px">${options}</select>
      </div>
      <textarea id="msg-text" rows="3" style="width:100%;margin-top:8px;background:rgba(255,255,255,.06);color:#dff3ff;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px" placeholder="Escribe tu mensaje..."></textarea>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px">
        <button class="btn btn-ghost" id="msg-send">Enviar</button>
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn btn-ghost" id="msg-mark">Marcar bandeja como leída</button>
      <button class="btn btn-primary" onclick="__closeModal()">Cerrar</button>
    </div>`;

  const m = openModal(html);
  const panel = m.panel.querySelector('#msg-panel');
  const compose = m.panel.querySelector('#compose');

  function switchTab(which){
    if(which==='compose'){ compose.style.display='block'; panel.innerHTML=''; }
    else { compose.style.display='none'; panel.innerHTML = renderPanel(which); }
  }

  const tabInbox = m.panel.querySelector('#tab-inbox');
  const tabSent  = m.panel.querySelector('#tab-sent');
  const tabCompose = m.panel.querySelector('#tab-compose');
  if(tabInbox) tabInbox.onclick = ()=>switchTab('inbox');
  if(tabSent)  tabSent.onclick  = ()=>switchTab('sent');
  if(tabCompose) tabCompose.onclick = ()=>switchTab('compose');

  const mark = m.panel.querySelector('#msg-mark');
  if(mark){ mark.onclick = ()=>{ try{ svc.markAllRead(session.id);}catch(e){} __closeModal(); }; }

  const sendBtn = m.panel.querySelector('#msg-send');
  if(sendBtn){
    sendBtn.onclick = () => {
      try{
        const toId = m.panel.querySelector('#msg-to')?.value;
        const text = m.panel.querySelector('#msg-text')?.value?.trim();
        const us = JSON.parse(localStorage.getItem('ks_users')||'[]');
        const me2 = us.find(u=>String(u.id)===String(session.id)) || session;
        const toUser = us.find(u=>String(u.id)===String(toId));
        if(toUser && text){
          svc.send(me2, toUser, text);
          __closeModal();
          setTimeout(()=>openMessagesModal(), 10); // refresca
        }
      }catch(e){}
    };
  }
};
</script>


<script>
(function bindMsgFab(){
  function attach(){
    var btn = document.getElementById('msg-fab');
    if(btn){
      btn.onclick = function(e){
        e.preventDefault(); e.stopPropagation();
        if (typeof window.openMessagesModal === 'function') {
          window.openMessagesModal();
        } else {
          // fallback: simple placeholder to confirm binding works
          openModal(`<h3>Mensajes</h3><div style='opacity:.8'>Cargando módulo…</div><div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn btn-primary" onclick="__closeModal()">Cerrar</button></div>`);
        }
      };
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', attach);
  } else {
    attach();
  }
})();
</script>
